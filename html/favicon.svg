<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#132F4A" rx="20"/>

  <!-- Email envelope -->
  <g transform="translate(20, 30)">
    <!-- Envelope body -->
    <rect x="0" y="5" width="60" height="40" fill="none" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Envelope flap -->
    <path d="M 0 5 L 30 20 L 60 5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>

    <!-- Email line -->
    <line x1="0" y1="25" x2="60" y2="25" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>
